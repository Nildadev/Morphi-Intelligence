name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # `22` (latest 22.x), not a pinned 22.12.0: `jsdom@30` -- the client test environment -- declares
        # `node: ^22.22.2 || ^24.15.0 || >=26.0.0`. On 22.12.0 every client test file failed to start its
        # worker ("Cannot read properties of undefined (reading 'bind')") while the server suite passed,
        # so the pin turned a supported Node version into a red build.
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck (source, test files, client build)
        run: npm run typecheck

      - name: Lint the client
        run: npm run lint

      - name: Test
        run: npm test

      # The Electron main process is plain JS with its own node:test suite; it is not part of `npm test`.
      - name: Test the Electron main process
        run: npm run test:main

      - name: Build
        run: npm run build

      # Boots the real server as a child process, asks it to quit over IPC and checks that it exits 0 with
      # its database closed. A Windows `child.kill()` skips the shutdown path entirely, so this is the only
      # check that the graceful branch still runs.
      - name: Verify the server quits cleanly
        working-directory: server
        run: node scripts/quit-check.mjs

      # Boots a server on a scratch database and sends 741 malformed requests at every route: any 5xx
      # means a handler trusted a shape the schema did not enforce.
      - name: Sweep the API with malformed input
        working-directory: server
        run: node scripts/api-junk.mjs
